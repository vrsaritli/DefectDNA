[project]
name = "defectdna"
version = "0.1.0"
description = "DefectDNA foundation services"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "motor>=3.6,<4",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mongomock-motor>=0.0.34,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["\\.venv", "tests"]

[tool.setuptools.packages.find]
include = ["libs*", "services*"]
